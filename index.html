<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Project PBO - POS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #101827, #1e3a5f);
      color: #fff;
    }

    .download-card {
      width: 100%;
      max-width: 480px;
      padding: 42px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
    }

    .file-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #2563eb;
      font-size: 38px;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 27px;
    }

    .description {
      margin-bottom: 25px;
      color: #d1d5db;
      line-height: 1.6;
      font-size: 14px;
    }

    .file-name {
      margin-bottom: 24px;
      padding: 13px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      color: #bfdbfe;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .download-button {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }

    .download-button:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .note {
      margin-top: 20px;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }

    footer {
      margin-top: 28px;
      color: #9ca3af;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .download-card {
        padding: 34px 22px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <main class="download-card">
    <div class="file-icon" aria-hidden="true">📦</div>
    <h1>Download Project POS</h1>
    <p class="description">
      Aplikasi Point of Sale (POS) Warung Kopi berbasis Java
      dengan penerapan Pemrograman Berorientasi Objek (PBO).
    </p>

    <div class="file-name">📁 Vmas.zip</div>

    <a
      class="download-button"
      href="https://github.com/vemasafif/vemas-afif-latihan-pbo-apk-pos-251101111/raw/refs/heads/main/Vmas.zip"
      download
    >
      ⬇ Download ZIP
    </a>

    <p class="note">
      Klik tombol di atas untuk mengunduh file project dalam format ZIP.
    </p>

    <footer>
      © 2026 Project PBO - Teknik Informatika
    </footer>
  </main>
</body>
</html>
